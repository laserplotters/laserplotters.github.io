document.addEventListener('DOMContentLoaded', function() {
    const pagination = document.querySelector('.pagination');
    
    if (pagination) {
        const links = pagination.querySelectorAll('a');
        
        if (links.length > 0) {
            const currentURL = window.location.pathname;
            const currentHREF = window.location.href;
            let currentPage = 1;
            
            const isHomePage = (currentURL === '/' || 
                              currentURL === '/index.html' || 
                              currentHREF.endsWith('/preview/index.html') ||
                              currentHREF.endsWith('/preview/')) &&
                              !currentURL.includes('/page/') && 
                              !currentURL.includes('/tags/');
            
            if (isHomePage) {
                pagination.style.display = 'none';
                return;
            }
            
            const match = currentURL.match(/page\/(\d+)/);
            if (match) {
                currentPage = parseInt(match[1]);
            }
            
            let totalPages = currentPage;
            
            links.forEach(link => {
                const pageMatch = link.href.match(/page\/(\d+)/);
                if (pageMatch) {
                    const pageNum = parseInt(pageMatch[1]);
                    if (pageNum > totalPages) {
                        totalPages = pageNum;
                    }
                }
                if (!link.href.includes('/page/') && totalPages < 1) {
                    totalPages = 1;
                }
            });
            
            const hasPreviousLink = Array.from(links).some(link => 
                link.textContent.trim().toLowerCase() === 'previous' || 
                link.textContent.trim() === '上一页'
            );
            
            if (hasPreviousLink) {
                const prevLink = Array.from(links).find(link => 
                    link.textContent.trim().toLowerCase() === 'previous' || 
                    link.textContent.trim() === '上一页'
                );
                if (prevLink) {
                    const nextPageMatch = prevLink.href.match(/page\/(\d+)/);
                    if (nextPageMatch) {
                        const nextPage = parseInt(nextPageMatch[1]);
                        totalPages = Math.max(totalPages, nextPage);
                    }
                }
            }
            
            if (totalPages <= 1 && currentPage === 1) {
                pagination.style.display = 'none';
                return;
            }
            
            const newPagination = document.createElement('div');
            newPagination.className = 'pagination-numbers';
            newPagination.style.cssText = 'display: flex; justify-content: center; gap: 0.5rem; margin: 2rem 0; align-items: center;';
            
            const isLocal = window.location.protocol === 'file:';
            let basePath = '';
            
            if (isLocal) {
                basePath = window.location.href
                    .replace(/\/[^\/]*$/, '')
                    .replace(/\/page\/\d+/, '');
            } else {
                const pathParts = currentURL.split('/');
                const pageIndex = pathParts.indexOf('page');
                if (pageIndex > -1) {
                    basePath = pathParts.slice(0, pageIndex).join('/');
                } else {
                    basePath = currentURL.replace(/\/[^\/]*$/, '');
                }
            }
            
            if (currentPage > 1) {
                const prevBtn = document.createElement('a');
                if (currentPage === 2) {
                    prevBtn.href = isLocal ? basePath + '/index.html' : basePath + (basePath.endsWith('/') ? '' : '/');
                } else {
                    prevBtn.href = isLocal ? 
                        basePath + '/page/' + (currentPage - 1) + '/index.html' : 
                        basePath + '/page/' + (currentPage - 1) + '/';
                }
                prevBtn.textContent = '←';
                prevBtn.className = 'btn pagination-btn';
                prevBtn.style.cssText = 'padding: 0.6rem 1rem; text-decoration: none; font-size: 1.2rem; min-width: 45px; text-align: center; border-radius: 18px;';
                newPagination.appendChild(prevBtn);
            }
            
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('a');
                
                if (i === 1) {
                    pageBtn.href = isLocal ? basePath + '/index.html' : basePath + (basePath.endsWith('/') ? '' : '/');
                } else {
                    pageBtn.href = isLocal ? 
                        basePath + '/page/' + i + '/index.html' : 
                        basePath + '/page/' + i + '/';
                }
                
                pageBtn.textContent = i;
                
                if (i === currentPage) {
                    pageBtn.className = 'btn pagination-current';
                    pageBtn.style.cssText = 'padding: 0.6rem 1rem; text-decoration: none; font-size: 1.2rem; min-width: 45px; text-align: center; background-color: #FFD700 !important; color: #000 !important; border-color: #FFD700 !important; font-weight: bold; pointer-events: none; border-radius: 18px; box-shadow: 0 4px 16px rgba(255, 215, 0, 0.4);';
                } else {
                    pageBtn.className = 'btn';
                    pageBtn.style.cssText = 'padding: 0.6rem 1rem; text-decoration: none; font-size: 1.2rem; min-width: 45px; text-align: center; border-radius: 18px;';
                }
                
                newPagination.appendChild(pageBtn);
            }
            
            if (currentPage < totalPages) {
                const nextBtn = document.createElement('a');
                nextBtn.href = isLocal ? 
                    basePath + '/page/' + (currentPage + 1) + '/index.html' : 
                    basePath + '/page/' + (currentPage + 1) + '/';
                nextBtn.textContent = '→';
                nextBtn.className = 'btn pagination-btn';
                nextBtn.style.cssText = 'padding: 0.6rem 1rem; text-decoration: none; font-size: 1.2rem; min-width: 45px; text-align: center; border-radius: 18px;';
                newPagination.appendChild(nextBtn);
            }
            
            pagination.parentNode.replaceChild(newPagination, pagination);
        }
    }
});</script><script>document.addEventListener('DOMContentLoaded', function() {
